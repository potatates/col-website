# 发布新闻：草稿检查无误后，在 Actions →「发布新闻」→ Run workflow，填入草稿编号（导入时显示的编号）。
# 也可以选「删除草稿」把不要的草稿删掉。
name: 发布新闻

on:
  workflow_dispatch:
    inputs:
      id:
        description: 新闻编号（如 2026-11-20-ab12cd）
        required: true
      action:
        description: 发布，还是删除这篇草稿
        type: choice
        options: [publish, delete]
        default: publish

permissions:
  contents: write
  actions: write

# 不用 concurrency 排队：GitHub 只保留一个排队中的运行，连续点几次会把前面的取消。改为推送前先合并最新内容、冲突时重试。

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 取最新内容（不是点按钮那一刻的旧版本）
      - name: Publish or delete
        env:
          ID: ${{ inputs.id }}
          ACTION: ${{ inputs.action }}
        run: |
          ID="$(echo "$ID" | tr -cd 'a-zA-Z0-9-' | tr 'A-Z' 'a-z')"
          DIR="src/news/$ID"
          if [ -n "$ID" ] && [ ! -d "$DIR" ] && [ "$ACTION" = "delete" ]; then echo "草稿 $ID 已经删除过了。" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if [ -z "$ID" ] || [ ! -d "$DIR" ]; then echo "找不到新闻 $ID（src/news/$ID）"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$ACTION" = "delete" ]; then
            if ! grep -q '^draft: true' "$DIR/zh.md"; then echo "这篇已经发布，不是草稿；为安全起见不在这里删除。"; exit 1; fi
            git rm -rq "$DIR"
            [ -d "public/news/$ID" ] && git rm -rq "public/news/$ID"
            MSG="删除新闻草稿：$ID"
          else
            for f in "$DIR"/*.md; do sed -i '/^draft: true$/d' "$f"; done
            git add "$DIR"
            MSG="发布新闻：$(grep -m1 '^title:' "$DIR/zh.md" | sed 's/^title: *//; s/^"//; s/"$//')"
          fi
          if git diff --cached --quiet; then echo "这篇已经发布过了，不用再发布。" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git commit -m "$MSG"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; echo "网站同时有别的更新，第 $i 次重试…"; sleep $((i * 5)); done
          git log origin/main -1 --format=%H | grep -q "$(git rev-parse HEAD)" || { echo "保存失败，请稍后重试"; exit 1; }
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
      - run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
