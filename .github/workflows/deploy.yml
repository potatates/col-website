# 推送到 main 分支后自动构建并发布到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每个交易日午间休市和收盘后各重新构建一次，刷新页面里的股价快照（海外访客连不上行情接口时显示）
  # 03:35 UTC = 北京时间 11:35；07:35 UTC = 15:35
  schedule:
    - cron: '35 3 * * 1-5'
    - cron: '35 7 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
      # 存档：2026-11-23 之前的旧版英文站（archive/en-v1 分支），发布在 <站点>/archive/en-v1/ 下，不影响主站。
      - uses: actions/checkout@v4
        with:
          ref: archive/en-v1
          path: _archive
      - run: npm ci && npm run build
        working-directory: _archive
        env:
          BASE_PATH: /${{ github.event.repository.name }}/archive/en-v1
          SITE_URL: https://${{ github.repository_owner }}.github.io
      - run: mkdir -p dist/archive && rm -rf dist/archive/en-v1 && cp -r _archive/dist dist/archive/en-v1
      # 新版英文站已于 2026-11-23 转正到 /en/。旧的预览地址 /new/... 自动跳转到对应的正式页面。
      - name: Redirect old /new/ preview links
        env:
          ROOT: /${{ github.event.repository.name }}
        run: |
          cd dist
          find . -name index.html -not -path './archive/*' -not -path './new/*' | while read f; do
            p="${f#./}"; p="${p%index.html}"
            mkdir -p "new/$p"
            printf '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><link rel="canonical" href="%s/%s"><meta http-equiv="refresh" content="0; url=%s/%s"><script>location.replace("%s/%s"+location.hash)</script>' "$ROOT" "$p" "$ROOT" "$p" "$ROOT" "$p" > "new/${p}index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
