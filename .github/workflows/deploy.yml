# 推送到 main 分支后自动构建并发布到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
      # Preview of the new English design: the en-redesign branch is built separately and
      # published under /new/ (…/col-website/new/en/). The main site above is not affected.
      # After pushing to en-redesign, re-run this workflow on main to refresh the preview.
      - uses: actions/checkout@v4
        with:
          ref: en-redesign
          path: _new
      - run: npm ci && npm run build
        working-directory: _new
        env:
          BASE_PATH: /${{ github.event.repository.name }}/new
          SITE_URL: https://${{ github.repository_owner }}.github.io
      - run: rm -rf dist/new && cp -r _new/dist dist/new
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
